# Hexo site configuration

# Site
title: Quchaosheng's Notes
subtitle: Robot Systems · Linux Runtime · Embedded & RISC-V
description: Quchaosheng 的机器人系统、Linux 实时性、嵌入式与 RISC-V 工程笔记和项目记录
keywords:
  - Linux Kernel
  - ROS 2
  - Embedded Systems
  - Robot Systems
  - Linux Real-Time
  - RISC-V
author: Quchaosheng
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://quchaosheng.github.io
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: true
  trailing_html: true

# Atom feed is generated locally by scripts/generate-atom-feed.js.
feed:
  path: atom.xml
  limit: 20

# Directories
source_dir: source
public_dir: public
tag_dir: tag
archive_dir: archives
category_dir: category
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: true
  tab_replace: ''
  wrap: true
  hljs: false

# Allow normal Markdown image syntax for post asset folders.
marked:
  prependRoot: true
  postAsset: true

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category and tag
default_category: 笔记
category_map:
tag_map:

# Date and time
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

# Pagination
per_page: 10
pagination_dir: page

# Theme
theme: Chic

# Deployment
deploy:
  type: git
  repo: https://github.com/Quchaosheng/Quchaosheng.github.io.git
  branch: master

